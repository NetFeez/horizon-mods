id = "aurora_bloom"
kind = "shader"
name = "Aurora Bloom"
summary = "Horizon shader pack (API 0.2) with an aurora sky, reflective rippling water and a gentle grade."
description = """Aurora Bloom is a Horizon shader pack for API 0.2. It adds a deeper day sky, a violet night with twinkling stars and brighter pulsing luceros, slow aurora curtains, cooler rippling water that mirrors the world and a gentle bloom-like grade over the whole image.

The first option is Presets: only lights, low, normal or enhanced. It works as a ceiling for cosmetic groups, so every effect also has its own switch, on by default, and the strength sliders stay available. Water quality (disabled to enhanced) is capped by the preset: the effective level is the lower of the two. With only lights the mirror pass is skipped.

The pack reads the colored light emitted by the Aurora Lights mod for held, dropped, framed, placed and enchanted sources, and shapes it into a Fresnel-and-wave-weighted sheen on water. It is the only recommended companion shader for that mod; do not enable Horizon Extras > Dynamic Lights as well.

Repo: https://github.com/netfeez/aura-bloom-shader
Mod repo: https://github.com/netfeez/aura-lights-mod"""
