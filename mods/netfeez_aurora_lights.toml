changelog = "Balances overlapping lights so the engine's additive sum approximates the brightest source instead of doubling at the same spot. Each light keeps its colour, radius and position; the faint enchanted halo fades beside brighter frames and drops, and a weaker held light yields to a clearly brighter neighbour. Ranking by power before reach stops weak halos taking a slot at the eight-light cap. Same Nov 21 Nightly pin (Horizon f037744) as 0.1.2."
